name: Compatibility & Regression Gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compat-and-tests:
    name: API 28 Preflight, Unit Contracts & Native Compile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache pinned build inputs
        uses: actions/cache@v4
        with:
          path: ~/.cache/saidroid-inputs
          key: saidroid-inputs-api28-${{ hashFiles('scripts/runtime/fetch-inputs.py') }}

      - name: Set up development environment and verify patches
        run: bash tools/setup-dev-env.sh

      - name: Run full regression suite and native compilation gate
        run: python3 tools/run-tests.py
